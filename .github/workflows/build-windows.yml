name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    name: PyInstaller onedir
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.md

      - name: Build and smoke-test packaged executable
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: FH6-Sniper-windows-${{ github.sha }}
          path: dist/FH6-Sniper/**
          if-no-files-found: error
          retention-days: 14
